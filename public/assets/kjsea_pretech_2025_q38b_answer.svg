<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Centre Line (Chain thin line: Long dash - Short dash / dot):</text>
    
    <!-- Centre line representation -->
    <line x1="20" y1="50" x2="400" y2="50" stroke="#0f172a" stroke-width="2" stroke-dasharray="35, 8, 8, 8, 35, 8, 8, 8, 35, 8, 8, 8, 35, 8, 8, 8, 35" stroke-linecap="round"/>
    
    <!-- Dimension showing 6 cm -->
    <line x1="20" y1="85" x2="400" y2="85" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr-end)"/>
    <line x1="20" y1="55" x2="20" y2="95" stroke="#94a3b8" stroke-width="1"/>
    <line x1="400" y1="55" x2="400" y2="95" stroke="#94a3b8" stroke-width="1"/>
    <text x="210" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">Length = 6 cm</text>
  </g>

  <defs>
    <marker id="arr-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M6,1 L1,4 L6,7 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-end" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
