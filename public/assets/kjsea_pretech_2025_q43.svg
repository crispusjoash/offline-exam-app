<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <g transform="translate(40, 20)">
    <!-- Table border -->
    <rect x="0" y="0" width="320" height="200" fill="none" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Header row -->
    <rect x="0" y="0" width="320" height="30" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
    <text x="10" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Item</text>
    <text x="200" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Amount (Ksh)</text>
    
    <!-- Column divider -->
    <line x1="180" y1="0" x2="180" y2="200" stroke="#0f172a" stroke-width="2"/>

    <!-- Rows -->
    <line x1="0" y1="60" x2="320" y2="60" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="90" x2="320" y2="90" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="120" x2="320" y2="120" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="150" x2="320" y2="150" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="0" y1="180" x2="320" y2="180" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Data -->
    <text x="10" y="50" font-family="sans-serif" font-size="14" fill="#334155">Cash in hand</text>
    <text x="300" y="50" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">15,000</text>
    
    <text x="10" y="80" font-family="sans-serif" font-size="14" fill="#334155">Cash at bank</text>
    <text x="300" y="80" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">10,000</text>
    
    <text x="10" y="110" font-family="sans-serif" font-size="14" fill="#334155">Capital</text>
    <text x="300" y="110" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">20,000</text>
    
    <text x="10" y="140" font-family="sans-serif" font-size="14" fill="#334155">Loans</text>
    <text x="300" y="140" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">5,000</text>
    
    <text x="10" y="170" font-family="sans-serif" font-size="14" fill="#334155">Stock</text>
    <text x="300" y="170" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">2,000</text>
    
    <text x="10" y="200" font-family="sans-serif" font-size="14" fill="#334155" dy="-6">Creditors</text>
    <text x="300" y="200" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end" dy="-6">2,000</text>
  </g>
</svg>
