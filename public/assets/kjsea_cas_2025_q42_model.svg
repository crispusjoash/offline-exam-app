<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <!-- White background for visibility -->
  <rect width="100%" height="100%" fill="white" />
  <style>
    .staff { stroke: black; stroke-width: 1.5; }
    .note { fill: black; }
    .stem { stroke: black; stroke-width: 1.5; }
    .barline { stroke: black; stroke-width: 2; }
    .text { font-family: sans-serif; font-size: 14px; fill: #475569; font-style: italic; }
    .clef { font-family: serif; font-size: 80px; }
    .time { font-family: serif; font-size: 24px; font-weight: bold; }
    .sharp { font-family: serif; font-size: 32px; font-weight: bold; }
  </style>
  
  <g transform="translate(40, 80)">
    <!-- 5 lines -->
    <line x1="0" y1="0" x2="620" y2="0" class="staff"/>
    <line x1="0" y1="12" x2="620" y2="12" class="staff"/>
    <line x1="0" y1="24" x2="620" y2="24" class="staff"/>
    <line x1="0" y1="36" x2="620" y2="36" class="staff"/>
    <line x1="0" y1="48" x2="620" y2="48" class="staff"/>
    
    <text x="5" y="48" class="clef" fill="black">&#119070;</text>
    <text x="35" y="16" class="sharp" fill="black">&#9839;</text>
    <text x="55" y="22" class="time" fill="black">C</text>

    <!-- Bar 1: G4(crotchet) A4(quaver) B4(quaver) C5(crotchet) D5(crotchet) -->
    <circle cx="100" cy="36" r="5" class="note"/>
    <line x1="104" y1="36" x2="104" y2="6" class="stem"/>

    <circle cx="130" cy="30" r="5" class="note"/>
    <line x1="134" y1="30" x2="134" y2="0" class="stem"/>
    <circle cx="150" cy="24" r="5" class="note"/>
    <line x1="154" y1="24" x2="154" y2="-6" class="stem"/>
    <!-- Beam -->
    <line x1="134" y1="0" x2="154" y2="-6" stroke="black" stroke-width="3"/>

    <circle cx="180" cy="18" r="5" class="note"/>
    <line x1="176" y1="18" x2="176" y2="48" class="stem"/>

    <circle cx="210" cy="12" r="5" class="note"/>
    <line x1="206" y1="12" x2="206" y2="42" class="stem"/>

    <line x1="240" y1="0" x2="240" y2="48" class="barline"/>
    
    <!-- Bar 2: E5,D5(quavers) C5,B4(quavers) A4(minim) -->
    <circle cx="260" cy="6" r="5" class="note"/>
    <line x1="256" y1="6" x2="256" y2="36" class="stem"/>
    <circle cx="280" cy="12" r="5" class="note"/>
    <line x1="276" y1="12" x2="276" y2="42" class="stem"/>
    <!-- Beam -->
    <line x1="256" y1="36" x2="276" y2="42" stroke="black" stroke-width="3"/>

    <circle cx="310" cy="18" r="5" class="note"/>
    <line x1="306" y1="18" x2="306" y2="48" class="stem"/>
    <circle cx="330" cy="24" r="5" class="note"/>
    <line x1="326" y1="24" x2="326" y2="54" class="stem"/>
    <!-- Beam -->
    <line x1="306" y1="48" x2="326" y2="54" stroke="black" stroke-width="3"/>

    <!-- Minim A4 -->
    <ellipse cx="370" cy="30" rx="6" ry="4" fill="transparent" stroke="black" stroke-width="2" transform="rotate(-15 370 30)"/>
    <line x1="375" y1="30" x2="375" y2="0" class="stem"/>

    <line x1="400" y1="0" x2="400" y2="48" class="barline"/>
    <text x="120" y="-20" class="text">Antecedent Phrase</text>

    <!-- Bar 3: B4 C5,D5 E5 D5 -->
    <circle cx="420" cy="24" r="5" class="note"/>
    <line x1="416" y1="24" x2="416" y2="54" class="stem"/>

    <circle cx="450" cy="18" r="5" class="note"/>
    <line x1="446" y1="18" x2="446" y2="48" class="stem"/>
    <circle cx="470" cy="12" r="5" class="note"/>
    <line x1="466" y1="12" x2="466" y2="42" class="stem"/>
    <!-- Beam -->
    <line x1="446" y1="48" x2="466" y2="42" stroke="black" stroke-width="3"/>

    <circle cx="500" cy="6" r="5" class="note"/>
    <line x1="496" y1="6" x2="496" y2="36" class="stem"/>
    <circle cx="530" cy="12" r="5" class="note"/>
    <line x1="526" y1="12" x2="526" y2="42" class="stem"/>

    <line x1="560" y1="0" x2="560" y2="48" class="barline"/>

    <!-- Bar 4: Minim G4 + Half Rest -->
    <ellipse cx="580" cy="36" rx="6" ry="4" fill="transparent" stroke="black" stroke-width="2" transform="rotate(-15 580 36)"/>
    <line x1="585" y1="36" x2="585" y2="6" class="stem"/>
    <rect x="600" y="20" width="12" height="4" fill="black" />
    
    <line x1="615" y1="0" x2="615" y2="48" class="barline"/>
    <line x1="620" y1="0" x2="620" y2="48" class="barline" style="stroke-width: 4;" />
    
    <text x="430" y="-20" class="text" fill="#059669">Answering Phrase</text>
  </g>
</svg>
