<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 230" width="100%" height="100%">
  <style>
    .text-title { font-family: 'Times New Roman', serif; font-size: 20px; font-style: italic; font-weight: bold; }
    .text-label { font-family: 'Times New Roman', serif; font-size: 18px; }
    .note { fill: #111; stroke: #111; }
  </style>
  
  <defs>
    <!-- Note head -->
    <g id="notehead">
      <ellipse cx="0" cy="0" rx="4.5" ry="3.5" transform="rotate(-25)" class="note" stroke-width="0"/>
    </g>
    <!-- Crotchet (Quarter Note) -->
    <g id="ta">
      <use href="#notehead" x="0" y="0"/>
      <line x1="3.5" y1="-2" x2="3.5" y2="-30" class="note" stroke-width="1.5"/>
    </g>
    <!-- Paired Quavers (Two Eighth Notes) -->
    <g id="titi">
      <use href="#notehead" x="0" y="0"/>
      <use href="#notehead" x="25" y="0"/>
      <line x1="3.5" y1="-2" x2="3.5" y2="-30" class="note" stroke-width="1.5"/>
      <line x1="28.5" y1="-2" x2="28.5" y2="-30" class="note" stroke-width="1.5"/>
      <rect x="3" y="-30" width="26.5" height="4" class="note" stroke-width="0"/>
    </g>
  </defs>

  <!-- Title -->
  <text x="175" y="30" class="text-title" text-anchor="middle">Njoo twende uwanjani</text>

  <!-- Row A -->
  <text x="20" y="70" class="text-label">A.</text>
  <use href="#titi" x="65" y="70"/>
  <use href="#titi" x="135" y="70"/>
  <use href="#titi" x="205" y="70"/>
  <use href="#ta" x="275" y="70"/>

  <!-- Row B -->
  <text x="20" y="115" class="text-label">B.</text>
  <use href="#titi" x="65" y="115"/>
  <use href="#ta" x="135" y="115"/>
  <use href="#titi" x="205" y="115"/>
  <use href="#titi" x="275" y="115"/>

  <!-- Row C -->
  <text x="20" y="160" class="text-label">C.</text>
  <use href="#ta" x="65" y="160"/>
  <use href="#titi" x="135" y="160"/>
  <use href="#ta" x="205" y="160"/>
  <use href="#titi" x="275" y="160"/>

  <!-- Row D -->
  <text x="20" y="205" class="text-label">D.</text>
  <use href="#ta" x="65" y="205"/>
  <use href="#titi" x="135" y="205"/>
  <use href="#titi" x="205" y="205"/>
  <use href="#titi" x="275" y="205"/>
</svg>
