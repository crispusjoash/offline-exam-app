<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <style>
    .box { fill: white; stroke: #111; stroke-width: 1.5; }
    .line { fill: none; stroke: #111; stroke-width: 1.5; }
    .text { font-family: 'Times New Roman', serif; font-size: 17px; text-anchor: middle; dominant-baseline: middle; fill: #111; font-variant: small-caps; font-weight: bold; }
    .town { font-size: 21px; }
  </style>
  
  <!-- Connective lines -->
  <path d="M 85,60 L 415,60 L 415,240 L 85,240 Z" class="line" />
  
  <!-- Center Text -->
  <text x="250" y="150" class="text town">TOWN</text>
  
  <!-- Top Box -->
  <rect x="165" y="30" width="170" height="60" class="box" />
  <text x="250" y="62" class="text">HEALTH CENTRE</text>
  
  <!-- Bottom Box -->
  <rect x="165" y="210" width="170" height="60" class="box" />
  <text x="250" y="242" class="text">RAILWAY STATION</text>
  
  <!-- Left Box -->
  <rect x="25" y="120" width="120" height="60" class="box" />
  <text x="85" y="152" class="text">MARKET</text>
  
  <!-- Right Box -->
  <rect x="355" y="120" width="120" height="60" class="box" />
  <text x="415" y="152" class="text">POLICE POST</text>
</svg>
