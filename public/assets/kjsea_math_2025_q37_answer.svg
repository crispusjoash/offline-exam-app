<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <style>
    text { font-family: 'Times New Roman', Times, serif; font-size: 18px; fill: #000; }
    .line-main { stroke: #000; stroke-width: 2.5; fill: none; }
    .line-north { stroke: #888; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
    .line-ans { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
    .arc { stroke: #000; stroke-width: 1.5; fill: none; }
    .arc-ans { stroke: #2563eb; stroke-width: 1.5; fill: none; }
    .point { fill: #000; }
    .label { font-size: 20px; font-weight: bold; }
    .measure { font-size: 16px; font-style: italic; fill: #555; }
    .measure-ans { font-size: 16px; font-weight: bold; fill: #2563eb; }
  </style>
