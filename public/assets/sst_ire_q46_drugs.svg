<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <style>
    .box { fill: white; stroke: #111; stroke-width: 1.5; }
    .label { font-family: 'Times New Roman', serif; font-size: 24px; text-anchor: middle; fill: #111; }
    .text { font-family: 'Times New Roman', serif; font-size: 22px; fill: #111; }
  </style>

  <!-- Box A -->
  <text x="135" y="35" class="label">A</text>
