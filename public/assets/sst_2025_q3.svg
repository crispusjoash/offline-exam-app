<svg width="400" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'Times New Roman', serif; font-size: 28px; fill: #333; }
  </style>
  <rect width="100%" height="100%" fill="transparent" />
  
  <text x="40" y="50" class="text">A.</text>
  <text x="90" y="50" class="text">Netball</text>
  <text x="260" y="50" class="text">-</text>
  <text x="290" y="50" class="text">Point</text>

  <text x="40" y="100" class="text">B.</text>
  <text x="90" y="100" class="text">Volleyball</text>
  <text x="260" y="100" class="text">-</text>
  <text x="290" y="100" class="text">Goal</text>

  <text x="40" y="150" class="text">C.</text>
  <text x="90" y="150" class="text">Soccer</text>
  <text x="260" y="150" class="text">-</text>
  <text x="290" y="150" class="text">Goal</text>

  <text x="40" y="200" class="text">D.</text>
  <text x="90" y="200" class="text">Handbail</text>
  <text x="260" y="200" class="text">-</text>
  <text x="290" y="200" class="text">Point</text>
</svg>
