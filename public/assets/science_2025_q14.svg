<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <style>
    .text { font-family: sans-serif; font-size: 18px; }
    .bold { font-weight: bold; font-family: serif; font-size: 20px;}
    .line { stroke: black; stroke-width: 1.5; }
  </style>
  
  <!-- Outer border -->
  <rect x="50" y="20" width="400" height="150" fill="none" stroke="black" stroke-width="1.5"/>
  
  <!-- Horizontal lines -->
  <line x1="50" y1="50" x2="450" y2="50" class="line"/>
  <line x1="50" y1="80" x2="450" y2="80" class="line"/>
  <line x1="50" y1="110" x2="450" y2="110" class="line"/>
  <line x1="50" y1="140" x2="450" y2="140" class="line"/>
  
  <!-- Vertical lines -->
  <line x1="100" y1="20" x2="100" y2="170" class="line"/>
  <line x1="320" y1="20" x2="320" y2="170" class="line"/>
  <line x1="390" y1="20" x2="390" y2="170" class="line"/>
  
  <!-- Header row -->
  <text x="210" y="42" class="text bold" text-anchor="middle">Property</text>
  <text x="355" y="42" class="text bold" text-anchor="middle">Solids</text>
  <text x="420" y="42" class="text bold" text-anchor="middle">Gases</text>
  
  <!-- Row 1 -->
  <text x="75" y="71" class="text" text-anchor="middle">A.</text>
  <text x="110" y="71" class="text">has weight</text>
  <text x="355" y="71" class="text" text-anchor="middle">Yes</text>
  <text x="420" y="71" class="text" text-anchor="middle">No</text>
  
  <!-- Row 2 -->
  <text x="75" y="101" class="text" text-anchor="middle">B.</text>
  <text x="110" y="101" class="text">has definite mass</text>
  <text x="355" y="101" class="text" text-anchor="middle">Yes</text>
  <text x="420" y="101" class="text" text-anchor="middle">Yes</text>
  
  <!-- Row 3 -->
  <text x="75" y="131" class="text" text-anchor="middle">C.</text>
  <text x="110" y="131" class="text">has definite shape</text>
  <text x="355" y="131" class="text" text-anchor="middle">No</text>
  <text x="420" y="131" class="text" text-anchor="middle">Yes</text>
  
  <!-- Row 4 -->
  <text x="75" y="161" class="text" text-anchor="middle">D.</text>
  <text x="110" y="161" class="text">has definite volume</text>
  <text x="355" y="161" class="text" text-anchor="middle">Yes</text>
  <text x="420" y="161" class="text" text-anchor="middle">Yes</text>
</svg>
