<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <style>
    .text-node { font-family: "Times New Roman", Times, serif; font-size: 22px; text-anchor: middle; dominant-baseline: middle; fill: #000; }
    .box-text { font-family: "Times New Roman", Times, serif; font-size: 20px; font-weight: bold; text-anchor: middle; dominant-baseline: central; fill: #000; }
    .line { stroke: #000; stroke-width: 1.5; fill: none; }
    .box { stroke: #000; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Root: Plants -->
  <text x="300" y="30" class="text-node">Plants</text>
  <line x1="300" y1="45" x2="300" y2="80" class="line" />

  <!-- Horizontal branch -->
  <line x1="150" y1="80" x2="450" y2="80" class="line" />

  <!-- Left branch -->
  <line x1="150" y1="80" x2="150" y2="140" class="line" />
  <text x="150" y="160" class="text-node">Flowering Plants</text>
  <line x1="150" y1="175" x2="150" y2="215" class="line" />
  <rect x="135" y="215" width="30" height="30" class="box" />
  <text x="150" y="230" class="box-text">E</text>

  <!-- Right branch -->
  <line x1="450" y1="80" x2="450" y2="140" class="line" />
  <text x="450" y="160" class="text-node">Non-Flowering Plants</text>
  <line x1="450" y1="175" x2="450" y2="215" class="line" />
  <rect x="435" y="215" width="30" height="30" class="box" />
  <text x="450" y="230" class="box-text">F</text>
</svg>
