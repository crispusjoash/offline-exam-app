<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <style>
    text { font-family: 'Times New Roman', Times, serif; font-size: 20px; fill: #000; }
    .header { font-size: 22px; font-weight: normal; }
    .line { stroke: #000; stroke-width: 2; }
  </style>

  <!-- Outer border -->
  <rect x="10" y="10" width="580" height="280" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Vertical lines -->
  <line x1="220" y1="10" x2="220" y2="290" class="line"/>
  <line x1="420" y1="10" x2="420" y2="290" class="line"/>

  <!-- Horizontal lines -->
  <line x1="10" y1="70" x2="590" y2="70" class="line"/>
  <line x1="10" y1="106.6" x2="590" y2="106.6" class="line"/>
  <line x1="10" y1="143.3" x2="590" y2="143.3" class="line"/>
  <line x1="10" y1="180" x2="590" y2="180" class="line"/>
  <line x1="10" y1="216.6" x2="590" y2="216.6" class="line"/>
  <line x1="10" y1="253.3" x2="590" y2="253.3" class="line"/>

  <!-- Header Text -->
  <text x="15" y="35" class="header">Transaction</text>
  <text x="15" y="60" class="header">range (Ksh)</text>

  <text x="225" y="35" class="header">Sending</text>
  <text x="225" y="60" class="header">charges (Ksh)</text>

  <text x="425" y="35" class="header">Withdrawal</text>
  <text x="425" y="60" class="header">charges (Ksh)</text>

  <!-- Row 1 -->
  <text x="15" y="96">1 - 150</text>
  <text x="320" y="96" text-anchor="middle">Free</text>
  <text x="505" y="96" text-anchor="middle">Free</text>

  <!-- Row 2 -->
  <text x="15" y="132">151 - 300</text>
  <text x="320" y="132" text-anchor="middle">10</text>
  <text x="505" y="132" text-anchor="middle">10</text>

  <!-- Row 3 -->
  <text x="15" y="169">301 - 500</text>
  <text x="320" y="169" text-anchor="middle">15</text>
  <text x="505" y="169" text-anchor="middle">23</text>

  <!-- Row 4 -->
  <text x="15" y="206">501 - 1 000</text>
  <text x="320" y="206" text-anchor="middle">25</text>
  <text x="505" y="206" text-anchor="middle">28</text>

  <!-- Row 5 -->
  <text x="15" y="242">1 001 - 2 500</text>
  <text x="320" y="242" text-anchor="middle">30</text>
  <text x="505" y="242" text-anchor="middle">35</text>

  <!-- Row 6 -->
  <text x="15" y="279">Above 2 500</text>
  <text x="320" y="279" text-anchor="middle">40</text>
  <text x="505" y="279" text-anchor="middle">55</text>
</svg>
