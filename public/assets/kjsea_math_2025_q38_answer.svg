<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <style>
    text { font-family: 'Times New Roman', Times, serif; font-size: 18px; fill: #2563eb; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
    .rect { stroke: #000; stroke-width: 2.5; fill: rgba(37, 99, 235, 0.05); }
    .fold { stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
    .dim { font-size: 16px; font-style: italic; fill: #555; font-weight: normal; }
  </style>

  <!-- 
    Base: 5x3 (200x120) at x=200, y=140 
    Front: 5x2 (200x80) at x=200, y=260
    Back: 5x2 (200x80) at x=200, y=60
    Top: 5x3 (200x120) at x=200, y=-60 (wait, let's shift down. top will be at y=20.)
  -->
  <g transform="translate(0, 20)">
    <rect x="200" y="0" width="200" height="120" class="rect" />
    <rect x="200" y="120" width="200" height="80" class="rect" />
    <rect x="200" y="200" width="200" height="120" class="rect" />
    <rect x="200" y="320" width="200" height="80" class="rect" />
    <rect x="120" y="200" width="80" height="120" class="rect" />
    <rect x="400" y="200" width="80" height="120" class="rect" />

    <!-- Fold lines -->
    <line x1="200" y1="120" x2="400" y2="120" class="fold" />
    <line x1="200" y1="200" x2="400" y2="200" class="fold" />
    <line x1="200" y1="320" x2="400" y2="320" class="fold" />
    <line x1="200" y1="200" x2="200" y2="320" class="fold" />
    <line x1="400" y1="200" x2="400" y2="320" class="fold" />

    <!-- Labels -->
    <text x="300" y="60">Top Face</text>
    <text x="300" y="160">Back Face</text>
    <text x="300" y="260">Base</text>
    <text x="300" y="360">Front Face</text>
    <text x="160" y="260" transform="rotate(-90, 160, 260)">Left Face</text>
    <text x="440" y="260" transform="rotate(-90, 440, 260)">Right Face</text>

    <!-- Dimensions -->
    <text x="300" y="-10" class="dim">5 cm</text>
    <text x="425" y="60" class="dim">3 cm</text>
    <text x="425" y="160" class="dim">2 cm</text>
    <text x="440" y="340" class="dim">2 cm</text>
    <text x="425" y="260" class="dim">3 cm</text>
    <text x="425" y="360" class="dim">2 cm</text>
    <text x="160" y="340" class="dim">2 cm</text>
  </g>
</svg>