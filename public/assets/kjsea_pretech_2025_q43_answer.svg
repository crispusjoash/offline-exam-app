<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <g transform="translate(20, 20)">
    <!-- Main Title -->
    <text x="280" y="0" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Biashara Club</text>
    <text x="280" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Statement of Financial Position as at 30th August, 2024</text>
    
    <!-- Table border -->
    <rect x="0" y="40" width="560" height="200" fill="none" stroke="#0f172a" stroke-width="2"/>
    
    <!-- Header row -->
    <rect x="0" y="40" width="560" height="30" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
    <text x="10" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Assets</text>
    <text x="270" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">Amount (Ksh)</text>
    <text x="290" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Capital &amp; Liabilities</text>
    <text x="550" y="60" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">Amount (Ksh)</text>
    
    <!-- Column dividers -->
    <line x1="280" y1="40" x2="280" y2="240" stroke="#0f172a" stroke-width="2"/>
    <line x1="200" y1="40" x2="200" y2="240" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="480" y1="40" x2="480" y2="240" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Left side (Assets) -->
    <text x="10" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-decoration="underline">Current Assets:</text>
    
    <text x="10" y="115" font-family="sans-serif" font-size="14" fill="#334155">Stock</text>
    <text x="270" y="115" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">2,000</text>
    
    <text x="10" y="140" font-family="sans-serif" font-size="14" fill="#334155">Cash at Bank</text>
    <text x="270" y="140" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">10,000</text>
    
    <text x="10" y="165" font-family="sans-serif" font-size="14" fill="#334155">Cash in Hand</text>
    <text x="270" y="165" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">15,000</text>
    
    <!-- Right side (Capital & Liabilities) -->
    <text x="290" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-decoration="underline">Capital:</text>
    
    <text x="290" y="115" font-family="sans-serif" font-size="14" fill="#334155">Owner's Capital</text>
    <text x="550" y="115" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">20,000</text>
    
    <text x="290" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-decoration="underline">Long-term Liabilities:</text>
    
    <text x="290" y="165" font-family="sans-serif" font-size="14" fill="#334155">Loans</text>
    <text x="550" y="165" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">5,000</text>
    
    <text x="290" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-decoration="underline">Current Liabilities:</text>
    
    <text x="290" y="215" font-family="sans-serif" font-size="14" fill="#334155">Creditors</text>
    <text x="550" y="215" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="end">2,000</text>
    
    <!-- Totals Row -->
    <line x1="0" y1="240" x2="560" y2="240" stroke="#0f172a" stroke-width="2"/>
    <line x1="0" y1="265" x2="560" y2="265" stroke="#0f172a" stroke-width="2"/>
    
    <text x="10" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Total Assets</text>
    <text x="270" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">27,000</text>
    
    <text x="290" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Total Capital &amp; Liabilities</text>
    <text x="550" y="258" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">27,000</text>
    
  </g>
</svg>
