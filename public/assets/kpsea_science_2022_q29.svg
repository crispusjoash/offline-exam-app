<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="100%" height="100%">
  <!-- Definitions for styling -->
  <style>
    .poster-box { fill: white; stroke: #2a2a2a; stroke-width: 3; }
    .pin { fill: #2a2a2a; }
    .string { stroke: #2a2a2a; stroke-width: 3; }
    .text-title { font-family: 'Times New Roman', Times, serif; font-size: 22px; font-weight: normal; fill: #2a2a2a; text-anchor: middle; }
    .text-item { font-family: 'Times New Roman', Times, serif; font-size: 26px; font-weight: bold; fill: #2a2a2a; }
  </style>

  <!-- Background -->
  <rect width="620" height="300" fill="#fcfcfc"/>

  <!-- Poster 1 -->
  <g transform="translate(30, 40)">
    <!-- Pin & String -->
    <circle cx="80" cy="-10" r="10" class="pin"/>
    <line x1="80" y1="-10" x2="80" y2="30" class="string"/>
    <!-- Box -->
    <rect x="15" y="30" width="130" height="180" class="poster-box"/>
    <!-- Text -->
    <text x="80" y="240" class="text-title">Poster 1</text>
    <text x="30" y="70" class="text-item">Beans</text>
    <text x="30" y="110" class="text-item">Meat</text>
    <text x="30" y="150" class="text-item">Eggs</text>
    <text x="30" y="190" class="text-item">Fish</text>
  </g>

  <!-- Poster 2 -->
  <g transform="translate(190, 40)">
    <!-- Pin & String -->
    <circle cx="95" cy="-10" r="10" class="pin"/>
    <line x1="95" y1="-10" x2="95" y2="30" class="string"/>
    <!-- Box -->
    <rect x="10" y="30" width="170" height="180" class="poster-box"/>
    <!-- Text -->
    <text x="95" y="240" class="text-title">Poster 2</text>
    <text x="25" y="70" class="text-item">Cassava</text>
    <text x="25" y="110" class="text-item">Rice</text>
    <text x="25" y="150" class="text-item">Bread</text>
    <text x="25" y="190" class="text-item">Ugali</text>
  </g>

  <!-- Poster 3 -->
  <g transform="translate(390, 40)">
    <!-- Pin & String -->
    <circle cx="100" cy="-10" r="10" class="pin"/>
    <line x1="100" y1="-10" x2="100" y2="30" class="string"/>
    <!-- Box -->
    <rect x="0" y="30" width="200" height="180" class="poster-box"/>
    <!-- Text -->
    <text x="100" y="240" class="text-title">Poster 3</text>
    <text x="15" y="70" class="text-item">Oranges</text>
    <text x="15" y="110" class="text-item">Spinach</text>
    <text x="15" y="150" class="text-item">Pineapples</text>
    <text x="15" y="190" class="text-item">Cabbages</text>
  </g>
</svg>
