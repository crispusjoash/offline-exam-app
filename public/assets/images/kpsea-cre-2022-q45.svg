<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <style>
    .label { font-family: 'Times New Roman', Times, serif; font-size: 20px; font-weight: bold; fill: #222; }
    .box { fill: #ffffff; stroke: #444444; stroke-width: 2; }
    .text { font-family: 'Times New Roman', Times, serif; font-size: 17px; fill: #222; }
  </style>

  <!-- Option A -->
  <text x="18" y="22" class="label">A</text>
  <rect x="18" y="28" width="190" height="80" class="box" />
  <text x="30" y="58" class="text">Healing.</text>
  <text x="30" y="84" class="text">Success.</text>

  <!-- Option B -->
  <text x="252" y="22" class="label">B</text>
  <rect x="252" y="28" width="190" height="80" class="box" />
  <text x="264" y="58" class="text">Richness.</text>
  <text x="264" y="84" class="text">Goodness.</text>

  <!-- Option C -->
  <text x="18" y="152" class="label">C</text>
  <rect x="18" y="158" width="190" height="80" class="box" />
  <text x="30" y="188" class="text">Wisdom.</text>
  <text x="30" y="214" class="text">Knowledge.</text>

  <!-- Option D -->
  <text x="252" y="152" class="label">D</text>
  <rect x="252" y="158" width="190" height="80" class="box" />
  <text x="264" y="188" class="text">Arrogance.</text>
  <text x="264" y="214" class="text">Ignorance.</text>
</svg>
