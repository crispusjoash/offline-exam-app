<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2px; }
    .text-line { font-family: 'Times New Roman', Times, serif; font-size: 18px; fill: #333333; text-anchor: middle; }
    .text-bold { font-family: 'Times New Roman', Times, serif; font-size: 22px; font-weight: bold; fill: #333333; text-anchor: middle; }
    .arrow-line { stroke: #333333; stroke-width: 2px; }
  </style>

  <!-- Box 1 -->
  <rect x="20" y="20" width="100" height="80" class="box" />
  <text x="70" y="55" class="text-line">Selecting</text>
  <text x="70" y="75" class="text-line">picture</text>

  <!-- Arrow 1 -->
  <line x1="120" y1="60" x2="150" y2="60" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Box 2 -->
  <rect x="155" y="20" width="100" height="80" class="box" />
  <text x="205" y="55" class="text-line">Cutting</text>
  <text x="205" y="75" class="text-line">picture</text>

  <!-- Arrow 2 -->
  <line x1="255" y1="60" x2="285" y2="60" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Box 3 -->
  <rect x="290" y="20" width="180" height="80" class="box" />
  <text x="380" y="55" class="text-line">Arranging and</text>
  <text x="380" y="75" class="text-line">applying adhesive</text>

  <!-- Arrow 3 -->
  <line x1="470" y1="60" x2="500" y2="60" class="arrow-line" marker-end="url(#arrow)" />

  <!-- Box 4 -->
  <rect x="505" y="20" width="70" height="80" class="box" />
  <text x="540" y="65" class="text-bold">X</text>

</svg>
