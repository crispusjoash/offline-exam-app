<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="100%" height="100%">
  <style>
    .label { font-family: 'Times New Roman', Times, serif; font-size: 20px; font-weight: bold; fill: #222; }
    .box { fill: #ffffff; stroke: #444444; stroke-width: 2; }
    .text { font-family: 'Times New Roman', Times, serif; font-size: 16px; fill: #222; }
  </style>

  <!-- Option A label -->
  <text x="18" y="24" class="label">A</text>
  <!-- Option A box -->
  <rect x="18" y="30" width="220" height="110" class="box" />
  <text x="30" y="58" class="text">Washing utensils</text>
  <text x="30" y="80" class="text">at home.</text>
  <text x="30" y="102" class="text">Taking care of a</text>
  <text x="30" y="124" class="text">younger brother.</text>

  <!-- Option B label -->
  <text x="280" y="24" class="label">B</text>
  <!-- Option B box -->
  <rect x="280" y="30" width="220" height="110" class="box" />
  <text x="292" y="58" class="text">Looking after</text>
  <text x="292" y="80" class="text">sheep at home.</text>
  <text x="292" y="102" class="text">Tilling the farm at</text>
  <text x="292" y="124" class="text">home.</text>

  <!-- Option C label -->
  <text x="18" y="172" class="label">C</text>
  <!-- Option C box -->
  <rect x="18" y="178" width="220" height="110" class="box" />
  <text x="30" y="206" class="text">Selling fruits in</text>
  <text x="30" y="228" class="text">the market.</text>
  <text x="30" y="250" class="text">Harvesting coffee</text>
  <text x="30" y="272" class="text">to get money.</text>

  <!-- Option D label -->
  <text x="280" y="172" class="label">D</text>
  <!-- Option D box -->
  <rect x="280" y="178" width="220" height="110" class="box" />
  <text x="292" y="206" class="text">Cooking for the</text>
  <text x="292" y="228" class="text">family.</text>
  <text x="292" y="250" class="text">Fetching water at</text>
  <text x="292" y="272" class="text">home.</text>
</svg>
