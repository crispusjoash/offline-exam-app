<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <!-- Main outer shape -->
  <path d="M 90 165 L 240 60 L 330 165 L 330 375 L 90 375 Z" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Horizontal divider -->
  <line x1="90" y1="165" x2="330" y2="165" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Dashed line for height (split into two pieces to leave a perfect gap for the text) -->
  <line x1="240" y1="60" x2="240" y2="98" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="5,5"/>
  <line x1="240" y1="128" x2="240" y2="165" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="5,5"/>
  
  <!-- Right angle square -->
  <polyline points="240,150 255,150 255,165" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  
  <!-- Height Text exactly on the dotted line, fitting inside the gap -->
  <text x="240" y="119" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">24 cm</text>
  
  <!-- Other labels -->
  <text x="345" y="275" fill="#0f172a" font-family="sans-serif" font-size="20">74 cm</text>
  <text x="210" y="415" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="20">65 cm</text>
</svg>
