<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <style>
    .shape { fill: none; stroke: #2a2a2a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="200" height="200" fill="#fcfcfc"/>
  
  <!-- Triangle -->
  <polygon points="100,30 30,150 170,150" class="shape"/>
  
  <!-- Cross (X) -->
  <line x1="45" y1="55" x2="155" y2="175" class="shape"/>
  <line x1="155" y1="55" x2="45" y2="175" class="shape"/>
</svg>
