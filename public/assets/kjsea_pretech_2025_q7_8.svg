<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320">
  <defs>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
    <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>

  <g stroke="#000" stroke-width="4" fill="none">
    <rect x="40" y="10" width="400" height="300" />
    <rect x="100" y="70" width="280" height="180" />
    
    <rect x="250" y="160" width="130" height="90" />
    <line x1="250" y1="190" x2="380" y2="190" stroke-width="2" />
    <line x1="250" y1="220" x2="380" y2="220" stroke-width="2" />
  </g>

  <g stroke="#000" stroke-width="2" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)">
    <!-- Top P -->
    <line x1="210" y1="12" x2="210" y2="68" />
    <!-- Bottom P -->
    <line x1="210" y1="252" x2="210" y2="308" />
    <!-- Left P -->
    <line x1="42" y1="150" x2="98" y2="150" />
    <!-- Right P -->
    <line x1="382" y1="120" x2="438" y2="120" />
  </g>

  <!-- Q Arrow pointing into the middle of the second box (y=205) -->
  <g stroke="#000" stroke-width="2" marker-start="url(#arrow-start)">
    <line x1="382" y1="205" x2="460" y2="205" />
  </g>

  <g font-family="sans-serif" font-size="24" fill="#000" text-anchor="middle">
    <text x="230" y="48">P</text>
    <text x="230" y="288">P</text>
    <text x="70" y="140">P</text>
    <text x="410" y="110">P</text>
    
    <!-- Q Text -->
    <text x="480" y="213" text-anchor="middle">Q</text>
  </g>
</svg>
