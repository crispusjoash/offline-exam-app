<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <g transform="translate(50, 40)">
    <!-- Construction baseline extended -->
    <line x1="-20" y1="200" x2="380" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
    <!-- Construction vertical lines extended -->
    <line x1="40" y1="220" x2="40" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="340" y1="220" x2="340" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- 90 degree construction arcs at A (40, 200) -->
    <path d="M 10 200 A 30 30 0 0 1 70 200" fill="none" stroke="#64748b" stroke-width="1.2" />
    <path d="M 20 180 A 25 25 0 0 1 45 160" fill="none" stroke="#3b82f6" stroke-width="1.2" />
    <path d="M 60 180 A 25 25 0 0 0 35 160" fill="none" stroke="#3b82f6" stroke-width="1.2" />
    
    <!-- 90 degree construction arcs at B (340, 200) -->
    <path d="M 310 200 A 30 30 0 0 1 370 200" fill="none" stroke="#64748b" stroke-width="1.2" />
    <path d="M 320 180 A 25 25 0 0 1 345 160" fill="none" stroke="#3b82f6" stroke-width="1.2" />
    <path d="M 360 180 A 25 25 0 0 0 335 160" fill="none" stroke="#3b82f6" stroke-width="1.2" />

    <!-- 4cm arc marks on vertical lines at y=60 -->
    <path d="M 30 60 A 15 15 0 0 1 50 60" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <path d="M 330 60 A 15 15 0 0 1 350 60" fill="none" stroke="#ef4444" stroke-width="1.5" />

    <!-- Rectangle Body (Bold Outline) -->
    <rect x="40" y="60" width="300" height="140" fill="none" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Right-angle symbols at corners -->
    <path d="M 40 75 L 55 75 L 55 60" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <path d="M 340 75 L 325 75 L 325 60" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <path d="M 40 185 L 55 185 L 55 200" fill="none" stroke="#0f172a" stroke-width="1.5" />
    <path d="M 340 185 L 325 185 L 325 200" fill="none" stroke="#0f172a" stroke-width="1.5" />
    
    <!-- Vertex Labels -->
    <text x="25" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">A</text>
    <text x="348" y="215" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">B</text>
    <text x="348" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">C</text>
    <text x="25" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">D</text>

    <!-- Length Dimension 6 cm -->
    <line x1="40" y1="240" x2="340" y2="240" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="40" y1="205" x2="40" y2="250" stroke="#64748b" stroke-width="1"/>
    <line x1="340" y1="205" x2="340" y2="250" stroke="#64748b" stroke-width="1"/>
    <text x="190" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Length = 6 cm</text>

    <!-- Width Dimension 4 cm -->
    <line x1="380" y1="60" x2="380" y2="200" stroke="#0f172a" stroke-width="1.5" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line x1="345" y1="60" x2="390" y2="60" stroke="#64748b" stroke-width="1"/>
    <line x1="345" y1="200" x2="390" y2="200" stroke="#64748b" stroke-width="1"/>
    <text x="415" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle" transform="rotate(90, 415, 130)">Width = 4 cm</text>
  </g>
  
  <defs>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M6,1 L1,4 L6,7 Z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L6,4 L1,7 Z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
