<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <g transform="translate(50, 40)">
    <text x="0" y="0" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">1. Long Break Line (Thin line with freehand zig-zags):</text>
    
    <!-- Long break line 6cm representation -->
    <path d="M 20 40 L 160 40 L 170 25 L 180 55 L 190 40 L 380 40" fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    
    <text x="0" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">2. Short Break Line (Continuous thin wavy line):</text>
    
    <!-- Short break line wavy -->
    <path d="M 20 115 Q 65 105, 110 115 T 200 115 T 290 115 T 380 115" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
